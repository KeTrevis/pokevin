<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Scripts Pokevin</title>
<link rel="stylesheet" href="../ui/script-editor.css">
<script type="module" src="../ui/script-editor.js"></script></head>
<body>
<aside aria-label="Scripts enregistrés">
  <div class="library-heading"><h1>Scripts</h1><button id="new-script" disabled>+ Nouveau script</button></div>
  <nav id="script-list" aria-label="Liste des scripts"></nav>
</aside>
<main id="workspace">
  <header><div class="script-heading"><label class="sr-only" for="script-name">Nom du script</label><input id="script-name" maxlength="80" placeholder="Nom du script" autocomplete="off" disabled></div><div class="actions"><button id="restart" class="icon-button" aria-label="Relancer" title="Relancer pour appliquer les modifications" hidden></button><button id="vim" class="icon-button" aria-label="Mode Vim" aria-pressed="false" title="Mode Vim"></button><button id="run" class="icon-button" aria-label="Exécuter" title="Exécuter" disabled></button></div></header>
  <div id="editor" aria-label="Code JavaScript"></div>
  <div id="empty"><p>Sélectionne un script ou crée le tien.</p></div>
  <footer><div class="status-line"><span id="vim-status" hidden></span><output id="status" role="status"></output><span id="save-status" role="status"></span></div><p>Ce code a accès à ta partie. Utilise uniquement du code de confiance.</p></footer>
</main>
<dialog id="delete-dialog" class="confirmation-dialog" aria-labelledby="delete-title" aria-describedby="delete-description">
  <h2 id="delete-title">Supprimer le script ?</h2>
  <p id="delete-description"></p>
  <form method="dialog"><button value="cancel" autofocus>Annuler</button><button value="delete">Supprimer</button></form>
</dialog>
<dialog id="changes-dialog" class="confirmation-dialog" aria-labelledby="changes-title" aria-describedby="changes-description">
  <h2 id="changes-title">Modifications non actives</h2>
  <p id="changes-description">Tes modifications sont sauvegardées. Le script utilise encore la version précédente.</p>
  <form method="dialog"><button value="continue" autofocus>Continuer sans relancer</button><button value="restart">Relancer et continuer</button></form>
</dialog>
</body></html>
